<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Member | Digital Library</title><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/add-member.css"></head>
<body data-title="Add / Edit Member">
  <div class="data-app" data-app><div data-page-content>
    <section class="card form-card">
      <div class="card-header"><h2 id="memberFormTitle">Add New Member</h2><a class="btn btn-outline" href="members.html">← Back</a></div>
      <div class="card-body">
        <form id="memberForm">
          <div class="form-grid">
            <div class="form-group"><label for="memberId">Member ID *</label><input id="memberId" name="memberId" class="form-control"></div>
            <div class="form-group"><label for="fullName">Full Name *</label><input id="fullName" name="fullName" class="form-control"></div>
            <div class="form-group"><label for="department">Department *</label><input id="department" name="department" class="form-control"></div>
            <div class="form-group"><label for="memberEmail">Email *</label><input id="memberEmail" name="email" class="form-control" type="email"></div>
            <div class="form-group"><label for="memberMobile">Mobile Number *</label><input id="memberMobile" name="mobile" class="form-control" inputmode="numeric"></div>
          </div>
          <p class="message" id="memberMessage"></p>
          <div class="form-actions"><button class="btn btn-primary" type="submit">Save Member</button><button class="btn btn-outline" type="reset">Reset</button></div>
        </form>
      </div>
    </section>
  </div></div>
  <script src="../js/storage.js"></script><script src="../js/common.js"></script><script src="../js/add-member.js"></script>
</body>
</html>
