<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Digital Library</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-image login-image">
      <div><a class="auth-brand" href="../index.html"><span>▣</span> Digital Library</a></div>
      <p>Manage knowledge.<br>Empower learning.</p>
    </section>
    <section class="auth-panel">
      <form class="auth-card" id="loginForm">
        <p class="eyebrow">Welcome back</p>
        <h1>Sign in to your account</h1>
        <div class="form-group">
          <label for="username">Username</label>
          <input class="form-control" id="username" name="username" autocomplete="username" placeholder="Enter username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password">
            <button id="togglePassword" type="button" aria-label="Show password">◉</button>
          </div>
        </div>
        <p class="message error" id="loginError"></p>
        <div class="auth-actions">
          <button class="btn btn-primary" type="submit">Login</button>
          <button class="btn btn-outline" id="resetLogin" type="button">Reset</button>
        </div>
        <p class="auth-switch">New administrator? <a href="register.html">Create an account</a></p>
        <p class="demo-note"><strong>Demo login:</strong> admin / admin123</p>
      </form>
    </section>
  </main>
  <script src="../js/storage.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
