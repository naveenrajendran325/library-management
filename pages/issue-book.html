<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Issue Book | Digital Library</title><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/issue-book.css"></head>
<body data-title="Issue Book">
  <div class="data-app" data-app><div data-page-content>
    <section class="issue-layout">
      <div class="card">
        <div class="card-header"><h2>Issue a Book</h2></div>
        <div class="card-body">
          <form id="issueForm">
            <div class="form-grid">
              <div class="form-group"><label for="issueId">Issue ID</label><input id="issueId" name="issueId" class="form-control" readonly></div>
              <div class="form-group"><label for="issueMember">Select Member *</label><select id="issueMember" name="memberId" class="form-control"></select></div>
              <div class="form-group"><label for="issueBook">Select Book *</label><select id="issueBook" name="bookId" class="form-control"></select></div>
              <div class="form-group"><label for="issueDate">Issue Date *</label><input id="issueDate" name="issueDate" class="form-control" type="date"></div>
              <div class="form-group"><label for="expectedReturnDate">Expected Return Date *</label><input id="expectedReturnDate" name="expectedReturnDate" class="form-control" type="date"></div>
            </div>
            <p class="message" id="issueMessage"></p>
            <div class="form-actions"><button class="btn btn-primary" type="submit">Issue Book</button><button class="btn btn-outline" type="reset">Reset</button></div>
          </form>
        </div>
      </div>
      <aside class="issue-image"><img src="../assets/images/lib2.jpg" alt="Student using library"></aside>
    </section>
    <section class="card issued-section"><div class="card-header"><h2>Issued Books</h2></div><div class="card-body table-wrap" id="issuedTable"></div></section>
  </div></div>
  <script src="../js/storage.js"></script><script src="../js/common.js"></script><script src="../js/issue-book.js"></script>
</body>
</html>
